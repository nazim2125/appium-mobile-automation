name: Appium Mobile Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-smoke:
    name: Android Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =========================================================
      # Node.js 20
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # =========================================================
      # Appium 2 + UiAutomator2
      # =========================================================
      - name: Install Appium 2 + UiAutomator2 driver
        run: |
          npm install -g appium

          echo "Appium version:"
          appium --version

          echo "Installing UiAutomator2:"
          appium driver install uiautomator2

          echo "Installed drivers:"
          appium driver list --installed

      # =========================================================
      # Download APK
      # =========================================================
      - name: Download My Demo App APK
        run: |
          mkdir -p apps

          curl -fL --retry 3 \
            -o apps/mda.apk \
            https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk

          echo "APK information:"
          ls -lh apps/mda.apk
          file apps/mda.apk

          echo "Validating APK:"
          unzip -t apps/mda.apk > /dev/null

          echo "APK validation successful."

      # =========================================================
      # Enable KVM
      # =========================================================
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -la /dev/kvm || true

      # =========================================================
      # Android emulator + Appium + tests
      # =========================================================
      - name: Run Android emulator + Appium + smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_6

          force-avd-creation: false

          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

          disable-animations: true

          script: |

            mkdir -p logs
            mkdir -p screenshots
            mkdir -p diagnostics

            echo "========================================"
            echo "ANDROID DEVICE"
            echo "========================================"

            adb devices -l

            echo "Android version:"
            adb shell getprop ro.build.version.release || true

            echo "Device model:"
            adb shell getprop ro.product.model || true

            # =====================================================
            # START APPIUM
            #
            # IMPORTANT:
            # Keep this command on ONE line.
            # =====================================================

            echo "========================================"
            echo "STARTING APPIUM"
            echo "========================================"

            appium --log-timestamp > logs/appium.log 2>&1 &

            APPIUM_PID=$!

            echo "Appium PID: $APPIUM_PID"

            sleep 5

            # =====================================================
            # Verify Appium process
            # =====================================================

            if ! kill -0 "$APPIUM_PID" 2>/dev/null; then
              echo "ERROR: Appium failed to start."
              echo "========== APPIUM LOG =========="
              cat logs/appium.log || true
              exit 1
            fi

            echo "Appium process is running."

            # =====================================================
            # Verify Appium HTTP server
            # =====================================================

            echo "Waiting for Appium server..."

            APPIUM_READY=false

            for i in {1..30}; do

              if curl -sf http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium server is ready."
                APPIUM_READY=true
                break
              fi

              echo "Waiting for Appium... attempt $i"
              sleep 1

            done

            if [ "$APPIUM_READY" != "true" ]; then
              echo "ERROR: Appium server is not responding."
              cat logs/appium.log || true
              exit 1
            fi

            # =====================================================
            # Verify APK exists
            # =====================================================

            echo "========================================"
            echo "APK"
            echo "========================================"

            ls -lh apps/mda.apk

            # =====================================================
            # Run tests
            # =====================================================

            echo "========================================"
            echo "RUNNING MAVEN TESTS"
            echo "========================================"

            set +e

            mvn clean test \
              -Dgroups=smoke \
              -Dplatform=android \
              -Denv=qa \
              -Dapp="$(pwd)/apps/mda.apk" \
              -DdeviceName=emulator-5554 \
              -DappiumServerUrl=http://127.0.0.1:4723 \
              -DnoReset=false \
              -DfullReset=false \
              -DsuiteXmlFile=testng.xml

            TEST_EXIT_CODE=$?

            set -e

            echo "Maven exit code: $TEST_EXIT_CODE"

            # =====================================================
            # Diagnostics
            # =====================================================

            echo "========================================"
            echo "COLLECTING DIAGNOSTICS"
            echo "========================================"

            adb devices -l \
              > diagnostics/devices.txt || true

            adb shell dumpsys window \
              > diagnostics/window.txt || true

            adb shell dumpsys activity \
              > diagnostics/activity.txt || true

            adb shell dumpsys window \
              | grep -E "mCurrentFocus|mFocusedApp" \
              > diagnostics/current-activity.txt || true

            # =====================================================
            # UI hierarchy
            # =====================================================

            adb shell uiautomator dump /sdcard/window.xml || true

            adb pull /sdcard/window.xml \
              diagnostics/window.xml || true

            # =====================================================
            # Screenshot
            # =====================================================

            adb exec-out screencap -p \
              > screenshots/ci-final-screen.png || true

            # =====================================================
            # Android logcat
            # =====================================================

            adb logcat -d \
              > logs/android-logcat.txt || true

            # =====================================================
            # Appium log
            # =====================================================

            cp logs/appium.log \
              diagnostics/appium.log \
              2>/dev/null || true

            # =====================================================
            # Return Maven result
            # =====================================================

            exit "$TEST_EXIT_CODE"

      # =========================================================
      # ExtentReports
      # =========================================================
      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports/
          if-no-files-found: warn

      # =========================================================
      # Screenshots
      # =========================================================
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: warn

      # =========================================================
      # Diagnostics
      # =========================================================
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: diagnostics/
          if-no-files-found: warn

      # =========================================================
      # Logs
      # =========================================================
      - name: Upload automation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: logs/
          if-no-files-found: warn

      # =========================================================
      # Maven reports
      # =========================================================
      - name: Upload Maven test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-results
          path: target/surefire-reports/
          if-no-files-found: warn