name: Appium Mobile Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Appium 2 + UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Download My Demo App APK
        run: |
          mkdir -p apps

          curl -fL --retry 3 \
            -o apps/mda.apk \
            https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk

          file apps/mda.apk

          unzip -l apps/mda.apk > /dev/null || {
            echo "Downloaded file is not a valid APK"
            exit 1
          }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ============================================================
      # THIS IS WHERE THE BLOCK YOU POSTED GOES
      # ============================================================

      - name: Run Android emulator + Appium + smoke tests
        uses: reactivecircus/android-emulator-runner@v2

        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_6
          force-avd-creation: false

          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none

          disable-animations: true

          script: |
            mkdir -p logs
            mkdir -p screenshots
            mkdir -p diagnostics

            echo "========================================"
            echo "ANDROID DEVICE"
            echo "========================================"

            adb devices -l

            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.model

            echo "========================================"
            echo "INSTALL APK DIRECTLY"
            echo "========================================"

            adb install -r "$(pwd)/apps/mda.apk"

            echo "APK INSTALL EXIT CODE: $?"

            echo "========================================"
            echo "INSTALLED PACKAGE"
            echo "========================================"

            adb shell pm list packages \
              | grep "com.saucelabs.mydemoapp.android" || true

            echo "========================================"
            echo "START APP DIRECTLY"
            echo "========================================"

            adb shell am force-stop \
              com.saucelabs.mydemoapp.android || true

            adb shell monkey \
              -p com.saucelabs.mydemoapp.android \
              1 || true

            sleep 10

            echo "========================================"
            echo "CURRENT ACTIVITY"
            echo "========================================"

            adb shell dumpsys window \
              | grep -E "mCurrentFocus|mFocusedApp" || true

            echo "========================================"
            echo "APP PROCESS"
            echo "========================================"

            adb shell pidof \
              com.saucelabs.mydemoapp.android || true

            echo "========================================"
            echo "START APPIUM"
            echo "========================================"

            appium --log-timestamp > logs/appium.log 2>&1 &

            sleep 8

            echo "========================================"
            echo "APPIUM STATUS"
            echo "========================================"

            curl -s \
              http://127.0.0.1:4723/status || true

            echo "========================================"
            echo "RUN MAVEN"
            echo "========================================"

            set +e

            mvn clean test \
              -Dgroups=smoke \
              -Dplatform=android \
              -Denv=qa \
              -Dapp="$(pwd)/apps/mda.apk" \
              -DdeviceName=emulator-5554 \
              -DappiumServerUrl=http://127.0.0.1:4723 \
              -DnoReset=false \
              -DfullReset=false \
              -DsuiteXmlFile=testng.xml

            TEST_EXIT_CODE=$?

            echo "Maven exit code: $TEST_EXIT_CODE"

            echo "========================================"
            echo "DIAGNOSTICS"
            echo "========================================"

            adb devices -l \
              > diagnostics/devices.txt || true

            adb shell dumpsys window \
              > diagnostics/window.txt || true

            adb shell dumpsys activity \
              > diagnostics/activity.txt || true

            adb shell dumpsys window \
              | grep -E "mCurrentFocus|mFocusedApp" \
              > diagnostics/current-activity.txt || true

            adb shell uiautomator dump \
              /sdcard/window.xml || true

            adb pull \
              /sdcard/window.xml \
              diagnostics/window.xml || true

            adb exec-out screencap -p \
              > screenshots/ci-final-screen.png || true

            adb logcat -d \
              > logs/android-logcat.txt || true

            cp logs/appium.log \
              diagnostics/appium.log 2>/dev/null || true

            exit "$TEST_EXIT_CODE"

      # ============================================================
      # REPORTS
      # ============================================================

      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports/
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: logs/
          if-no-files-found: ignore