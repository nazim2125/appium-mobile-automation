# =========================================================
# Default configuration — QA / local emulator execution
# Any value here can be overridden with -D<key>=<value>
# on the Maven command line, or an environment variable of
# the same name (env vars take precedence over this file,
# system properties take precedence over env vars).
# See ConfigReader.java for the resolution order.
# =========================================================

# ---- Platform ----
platform=android
automationName=UiAutomator2
deviceName=emulator-5554
platformVersion=

# ---- App under test: Sauce Labs "My Demo App" (Android) ----
app=./apps/mda-2.2.0.apk
appPackage=com.saucelabs.mydemoapp.android
appActivity=com.saucelabs.mydemoapp.android.view.activities.MainActivity
appWaitActivity=com.saucelabs.mydemoapp.android.view.activities.MainActivity
appWaitDuration=30000
# ---- Appium server ----
appiumServerUrl=http://127.0.0.1:4723

# ---- Session behaviour ----
noReset=false
fullReset=false
autoGrantPermissions=true
newCommandTimeout=120

# ---- Environment / reporting ----
environment=qa
implicitWaitSeconds=5
explicitWaitSeconds=15

# ---- Test account ----
# Do NOT hardcode real credentials here in a shared repo.
# These are the public demo credentials published by Sauce Labs
# for "My Demo App" and are safe to keep in source control.
# Override with TEST_USERNAME / TEST_PASSWORD env vars for anything else.
testUsername=bob@example.com
testPassword=10203040
lockedUsername=alice@example.com
lockedPassword=10203040
