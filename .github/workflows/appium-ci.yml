name: Appium Mobile Automation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  android-smoke:

    name: Android Smoke Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA
      # =========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # =========================================================
      # NODE
      # =========================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # =========================================================
      # APPIUM 3
      # =========================================================

      - name: Install Appium 3 + UiAutomator2
        run: |
          npm install -g appium@3

          echo "========================================"
          echo "APPIUM VERSION"
          echo "========================================"

          appium --version

          echo "========================================"
          echo "INSTALL UIAUTOMATOR2"
          echo "========================================"

          appium driver install uiautomator2

          echo "========================================"
          echo "INSTALLED DRIVERS"
          echo "========================================"

          appium driver list --installed

          echo "========================================"
          echo "APPIUM DOCTOR"
          echo "========================================"

          appium driver doctor uiautomator2 || true


      # =========================================================
      # APK
      # =========================================================

      - name: Download My Demo App APK
        run: |
          mkdir -p apps

          curl -fL --retry 3 \
            -o apps/mda.apk \
            https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk

          echo "========================================"
          echo "APK"
          echo "========================================"

          ls -lh apps/mda.apk

          file apps/mda.apk

          unzip -t apps/mda.apk > /dev/null

          echo "APK validation successful."


      # =========================================================
      # KVM
      # =========================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules

          sudo udevadm trigger --name-match=kvm

          echo "========================================"
          echo "KVM"
          echo "========================================"

          ls -la /dev/kvm || true


      # =========================================================
      # CREATE ANDROID TEST SCRIPT
      # =========================================================

      - name: Prepare Android test script
        run: |
          chmod +x scripts/run-android-smoke.sh

          echo "========================================"
          echo "ANDROID SCRIPT"
          echo "========================================"

          ls -lh scripts/run-android-smoke.sh


      # =========================================================
      # ANDROID EMULATOR
      # =========================================================

      - name: Run Android emulator + Appium + smoke tests
        uses: reactivecircus/android-emulator-runner@v2

        with:

          api-level: 33

          arch: x86_64

          target: default

          profile: pixel_6

          force-avd-creation: true

          emulator-options: >-
            -no-snapshot-load
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none

          disable-animations: true

          script: bash scripts/run-android-smoke.sh


      # =========================================================
      # EXTENT REPORT
      # =========================================================

      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: extent-report

          path: reports/

          if-no-files-found: warn


      # =========================================================
      # SCREENSHOTS
      # =========================================================

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: failure-screenshots

          path: screenshots/

          if-no-files-found: warn


      # =========================================================
      # ANDROID DIAGNOSTICS
      # =========================================================

      - name: Upload Android Diagnostics
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: android-diagnostics

          path: diagnostics/

          if-no-files-found: warn


      # =========================================================
      # AUTOMATION LOGS
      # =========================================================

      - name: Upload Automation Logs
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: automation-logs

          path: logs/

          if-no-files-found: warn


      # =========================================================
      # MAVEN TEST RESULTS
      # =========================================================

      - name: Upload Maven Test Results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: maven-test-results

          path: target/surefire-reports/

          if-no-files-found: warn