name: Appium Mobile Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-smoke:
    name: Android Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =========================================================
      # 3. Node.js 20
      # =========================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # =========================================================
      # 4. Install Appium 2
      # =========================================================
      - name: Install Appium
        run: |
          npm install -g appium
          echo "Appium version:"
          appium --version

      # =========================================================
      # 5. Install UiAutomator2
      # =========================================================
      - name: Install UiAutomator2 Driver
        run: |
          appium driver install uiautomator2
          echo "Installed Appium drivers:"
          appium driver list --installed

      # =========================================================
      # 6. Download My Demo App APK
      # =========================================================
      - name: Download My Demo App APK
        run: |
          mkdir -p apps

          curl -fL --retry 3 \
            -o apps/mda.apk \
            https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk

          echo "========================================"
          echo "APK INFORMATION"
          echo "========================================"

          ls -lh apps/mda.apk
          file apps/mda.apk

          echo "========================================"
          echo "VALIDATING APK"
          echo "========================================"

          unzip -t apps/mda.apk > /dev/null

          echo "APK validation successful."

      # =========================================================
      # 7. Enable KVM
      # =========================================================
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          echo "========================================"
          echo "KVM STATUS"
          echo "========================================"

          ls -la /dev/kvm || true

      # =========================================================
      # 8. Android Emulator + Appium + Tests
      # =========================================================
      - name: Run Android emulator + Appium + smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_6

          force-avd-creation: true

          emulator-options: >
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -no-snapshot
            -wipe-data

          disable-animations: true

          script: |
            set -u

            # =====================================================
            # Create directories
            # =====================================================

            mkdir -p logs
            mkdir -p screenshots
            mkdir -p diagnostics

            # =====================================================
            # Verify Android device
            # =====================================================

            echo "========================================"
            echo "ANDROID DEVICE"
            echo "========================================"

            adb devices -l

            adb shell getprop ro.build.version.release \
              > diagnostics/android-version.txt || true

            adb shell getprop ro.product.model \
              > diagnostics/device-model.txt || true

            echo "Android version:"
            cat diagnostics/android-version.txt || true

            echo "Device model:"
            cat diagnostics/device-model.txt || true

            # =====================================================
            # Start Appium
            # =====================================================

            echo "========================================"
            echo "STARTING APPIUM"
            echo "========================================"

            appium --log-timestamp --log-level info > logs/appium.log 2>&1 &

            APPIUM_PID=$!

            echo "Appium PID: $APPIUM_PID"

            sleep 5

            # =====================================================
            # Verify Appium process
            # =====================================================

            echo "========================================"
            echo "APPIUM STATUS"
            echo "========================================"

            if ! kill -0 "$APPIUM_PID" 2>/dev/null; then
              echo "ERROR: Appium process failed to start."
              echo "===== APPIUM LOG ====="
              cat logs/appium.log || true
              exit 1
            fi

            ps aux | grep '[a]ppium' || true

            echo "===== APPIUM LOG ====="
            tail -100 logs/appium.log || true

            # =====================================================
            # Wait for Appium server
            # =====================================================

            echo "========================================"
            echo "WAITING FOR APPIUM SERVER"
            echo "========================================"

            APPIUM_READY=false

            for i in {1..30}; do

              if curl -sf http://127.0.0.1:4723/status > /dev/null; then
                echo "Appium server is ready."
                APPIUM_READY=true
                break
              fi

              echo "Waiting for Appium... attempt $i"
              sleep 1

            done

            if [ "$APPIUM_READY" != "true" ]; then
              echo "ERROR: Appium server did not become ready."
              cat logs/appium.log || true
              exit 1
            fi

            curl -s http://127.0.0.1:4723/status || true

            # =====================================================
            # Install APK
            # =====================================================

            echo "========================================"
            echo "INSTALLING APK"
            echo "========================================"

            adb install -r apps/mda.apk

            echo "APK installed successfully."

            # =====================================================
            # Installed packages
            # =====================================================

            echo "========================================"
            echo "INSTALLED PACKAGES"
            echo "========================================"

            adb shell pm list packages \
              | grep -Ei "sauce|mydemo|demo" \
              > diagnostics/installed-packages.txt || true

            cat diagnostics/installed-packages.txt || true

            # =====================================================
            # Current activity
            # =====================================================

            echo "========================================"
            echo "CURRENT ACTIVITY BEFORE TESTS"
            echo "========================================"

            adb shell dumpsys window \
              | grep -E "mCurrentFocus|mFocusedApp" \
              > diagnostics/current-activity-before.txt || true

            cat diagnostics/current-activity-before.txt || true

            # =====================================================
            # Run Maven tests
            # =====================================================

            echo "========================================"
            echo "RUNNING APPIUM TESTS"
            echo "========================================"

            set +e

            mvn clean test \
              -Dgroups=smoke \
              -Dplatform=android \
              -Denv=qa \
              -Dapp="$(pwd)/apps/mda.apk" \
              -DdeviceName=emulator-5554 \
              -DappiumServerUrl=http://127.0.0.1:4723 \
              -DnoReset=false \
              -DfullReset=false \
              -DsuiteXmlFile=testng.xml

            TEST_EXIT_CODE=$?

            set -e

            echo "Maven exit code: $TEST_EXIT_CODE"

            # =====================================================
            # Collect diagnostics
            # =====================================================

            echo "========================================"
            echo "COLLECTING DIAGNOSTICS"
            echo "========================================"

            adb devices -l \
              > diagnostics/devices.txt || true

            adb shell dumpsys window \
              > diagnostics/window.txt || true

            adb shell dumpsys activity \
              > diagnostics/activity.txt || true

            adb shell dumpsys package \
              > diagnostics/packages.txt || true

            adb shell dumpsys window \
              | grep -E "mCurrentFocus|mFocusedApp" \
              > diagnostics/current-activity-after.txt || true

            # =====================================================
            # UI hierarchy
            # =====================================================

            echo "========================================"
            echo "DUMPING UI HIERARCHY"
            echo "========================================"

            adb shell uiautomator dump /sdcard/window.xml || true

            adb pull /sdcard/window.xml \
              diagnostics/window.xml || true

            # =====================================================
            # Screenshot
            # =====================================================

            echo "========================================"
            echo "CAPTURING SCREENSHOT"
            echo "========================================"

            adb exec-out screencap -p \
              > screenshots/ci-final-screen.png || true

            # =====================================================
            # Android logcat
            # =====================================================

            echo "========================================"
            echo "CAPTURING ANDROID LOGCAT"
            echo "========================================"

            adb logcat -d \
              > logs/android-logcat.txt || true

            # =====================================================
            # Appium log
            # =====================================================

            cp logs/appium.log \
              diagnostics/appium.log \
              2>/dev/null || true

            # =====================================================
            # Maven results
            # =====================================================

            echo "========================================"
            echo "SUREFIRE RESULTS"
            echo "========================================"

            find target/surefire-reports \
              -maxdepth 2 \
              -type f \
              -print \
              2>/dev/null || true

            # =====================================================
            # Return test result
            # =====================================================

            exit "$TEST_EXIT_CODE"

      # =========================================================
      # 9. Upload ExtentReports
      # =========================================================

      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports/
          if-no-files-found: warn

      # =========================================================
      # 10. Upload screenshots
      # =========================================================

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: warn

      # =========================================================
      # 11. Upload diagnostics
      # =========================================================

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: diagnostics/
          if-no-files-found: warn

      # =========================================================
      # 12. Upload logs
      # =========================================================

      - name: Upload automation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: logs/
          if-no-files-found: warn

      # =========================================================
      # 13. Upload Maven results
      # =========================================================

      - name: Upload Maven test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-results
          path: target/surefire-reports/
          if-no-files-found: warn